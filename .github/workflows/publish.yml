name: Publish

# Publishing is driven by a version tag, so the released artifact is always
# traceable to a commit. `npm version` creates the tag; pushing it ships.
#
# Auth is npm Trusted Publishing (OIDC): npmjs.com trusts exactly THIS
# workflow in THIS repo. No token exists anywhere — nothing to store, leak, or
# rotate — and provenance is attested on the registry. `npm publish`
# (npm >= 11.5) exchanges the id-token itself. Copied from speechkit (which copied ai-kit).
#
# npm Trusted Publishing is a one-time setup for this package and workflow.
# Keep the job gated until that trust is configured and NPM_PUBLISHING is "on".
# The tag-specific manual dispatch below lets the already-verified immutable
# release be published after setup without moving or recreating its tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish the exact verified release tag (for example v0.1.1).'
        required: true
        type: string
      diagnose_auth:
        description: Test the npm OIDC binding without publishing or printing credentials.
        type: boolean
        default: false

# Publishing is idempotent: the job first asks the registry whether
# package.json's version already exists and skips (green) if it does. A
# re-pushed tag, a re-run, or two runs for the same version cannot paint a
# spurious E403 red — a red run that means "nothing is wrong" trains everyone
# to ignore the workflow (bip-kit 0.2.6 and 0.2.7, 2026-09-11). Runs are also
# serialised so two cannot race past the check; never cancelled, because a
# cancelled publish is a half-shipped release.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.NPM_PUBLISHING == 'on'
    permissions:
      contents: read
      # Required for npm provenance — proves on the registry that this tarball
      # was built by this workflow from this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # pnpm version comes from "packageManager" in package.json (SSOT).
      - uses: pnpm/action-setup@v6

      # Leave npm auth configuration empty so the CLI can use OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Diagnose the saved npm trust binding (no publish)
        if: inputs.diagnose_auth == true
        run: |
          node --input-type=module <<'NODE'
          const audience = 'npm:registry.npmjs.org';
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', audience);
          const identity = await fetch(url, {
            headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(30000),
          });
          if (!identity.ok) throw new Error(`GitHub OIDC request failed: HTTP ${identity.status}`);
          const { value: jwt } = await identity.json();
          const claims = JSON.parse(Buffer.from(jwt.split('.')[1], 'base64url'));
          const fields = ['repository', 'repository_id', 'repository_owner', 'workflow_ref', 'job_workflow_ref', 'ref', 'environment', 'aud'];
          console.log('Publisher identity:', JSON.stringify(Object.fromEntries(fields.filter(k => claims[k] !== undefined).map(k => [k, claims[k]]))));
          const packageName = JSON.parse(await (await import('node:fs/promises')).readFile('package.json', 'utf8')).name;
          const exchange = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(packageName)}`, {
            method: 'POST', headers: { authorization: `Bearer ${jwt}` },
            signal: AbortSignal.timeout(30000),
          });
          console.log(`npm trust exchange for ${packageName}: HTTP ${exchange.status}`);
          // Never print the response body: success contains an npm access token.
          if (!exchange.ok) throw new Error('npm rejected this publisher identity; no publication attempted');
          await exchange.body?.cancel();
          NODE

      - name: Is this version already on the registry?
        if: inputs.diagnose_auth != true
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "→ $name@$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "✅ \`$name@$version\` is already published — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "→ $name@$version is not on the registry; releasing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Never publish something that would not have passed CI.
      - if: steps.check.outputs.publish == 'true'
        run: pnpm run verify

      # Refuse to publish a tag whose version does not match package.json,
      # rather than silently shipping the wrong number.
      - name: Check tag matches package version
        if: steps.check.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag like v0.1.1, got $RELEASE_TAG" >&2
            exit 1
          fi
          tag="${RELEASE_TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version $pkg" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$(git describe --tags --exact-match HEAD)" != "$RELEASE_TAG" ]; then
            echo "The selected checkout is not the exact immutable release tag $RELEASE_TAG" >&2
            exit 1
          fi

      # npm >= 11.5 exchanges the OIDC id-token itself — no secret involved.
      - name: Publish to npm (OIDC, tokenless)
        if: steps.check.outputs.publish == 'true'
        env:
          NAME: ${{ steps.check.outputs.name }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if npm publish --access public --provenance; then
            echo "🚀 Published \`$NAME@$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
          elif npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            # The check above and this publish are not atomic. If another run
            # slipped between them, the version is on the registry — which is
            # the goal state, not an error.
            echo "→ $NAME@$VERSION was published by a concurrent run; nothing to do."
            echo "✅ \`$NAME@$VERSION\` was published by a concurrent run — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            exit 1
          fi

  # Present only so a tag before the bootstrap reads as a decision, not a
  # silent no-op: the run is green and its summary says what to do.
  not-yet:
    runs-on: ubuntu-latest
    if: vars.NPM_PUBLISHING != 'on'
    steps:
      - run: |
          echo "npm publishing is not bootstrapped for this repo yet — nothing published." >> "$GITHUB_STEP_SUMMARY"
          echo "Consumers install from git meanwhile: pnpm add github:bitbaum/paykit#${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
